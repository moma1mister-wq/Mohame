<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0f172a">
<title>أكاديمية البرمجة | مكتبة المواد الدراسية</title>
<style>
  :root {
    --bg: #0b1220;
    --bg2: #111827;
    --card: #1a2332;
    --card-hover: #243044;
    --border: #2d3a4f;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --accent: #06b6d4;
    --success: #10b981;
    --pdf: #f59e0b;
    --pdf-hover: #d97706;
    --radius: 14px;
    --shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  body.viewer-open { overflow: hidden; }

  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    position: sticky; top: 0; z-index: 200;
  }
  .header-inner {
    max-width: 1500px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; flex-wrap: wrap;
  }
  .logo { display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 1.35rem; }
  .logo-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
  }
  .search-wrap { flex: 1; max-width: 420px; position: relative; }
  .search-wrap input {
    width: 100%; padding: 0.7rem 1rem 0.7rem 2.6rem;
    border: 1px solid var(--border); border-radius: 50px;
    background: var(--bg2); color: var(--text); font-size: 0.95rem; outline: none;
  }
  .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.25); }
  .search-wrap::before { content: "🔍"; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); opacity: 0.7; }
  .stats { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .stat-badge {
    background: var(--card); border: 1px solid var(--border);
    padding: 0.4rem 0.9rem; border-radius: 50px; font-size: 0.85rem; color: var(--text-muted);
  }
  .stat-badge strong { color: var(--accent); }

  .layout {
    max-width: 1500px; margin: 0 auto; padding: 1.25rem;
    display: grid; grid-template-columns: 270px 1fr; gap: 1.25rem;
  }
  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static !important; max-height: none; }
  }

  .sidebar {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1rem; height: fit-content; position: sticky; top: 90px;
    max-height: calc(100vh - 110px); overflow-y: auto;
  }
  .sidebar h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem; padding: 0 0.4rem; }
  .sem-group { margin-bottom: 1.1rem; }
  .sem-title { font-weight: 600; font-size: 0.95rem; padding: 0.5rem 0.6rem; color: var(--accent); display: flex; align-items: center; gap: 0.4rem; }
  .subj-btn {
    display: flex; align-items: center; gap: 0.55rem; width: 100%;
    padding: 0.65rem 0.75rem; margin: 0.2rem 0; border: none; background: transparent;
    border-radius: 10px; cursor: pointer; font-size: 0.9rem; color: var(--text); text-align: right; transition: all 0.2s;
  }
  .subj-btn:hover { background: var(--card-hover); }
  .subj-btn.active {
    background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(6,182,212,0.15));
    border: 1px solid rgba(59,130,246,0.4); color: #fff;
  }
  .subj-btn .counts { margin-right: auto; font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 0.35rem; }
  .subj-btn.active .counts { color: var(--accent); }
  .badge-v { background: rgba(59,130,246,0.2); color: #60a5fa; padding: 0.1rem 0.4rem; border-radius: 6px; }
  .badge-p { background: rgba(245,158,11,0.2); color: #fbbf24; padding: 0.1rem 0.4rem; border-radius: 6px; }

  .main { display: flex; flex-direction: column; gap: 1.25rem; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
  .panel-header {
    display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.1rem;
    padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);
  }
  .panel-header h2 { font-size: 1.2rem; font-weight: 600; }
  .panel-header .meta { margin-right: auto; font-size: 0.85rem; color: var(--text-muted); }

  .tabs { display: flex; gap: 0.4rem; margin-bottom: 1.1rem; background: var(--bg2); padding: 0.3rem; border-radius: 10px; width: fit-content; }
  .tab-btn {
    padding: 0.5rem 1.1rem; border: none; background: transparent; color: var(--text-muted);
    border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;
  }
  .tab-btn.active { background: var(--primary); color: #fff; }
  .tab-btn:hover:not(.active) { color: var(--text); }

  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 0.9rem; }
  .item-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem; transition: all 0.22s; display: flex; flex-direction: column; gap: 0.65rem;
  }
  .item-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.12); }
  .item-num { font-size: 0.75rem; color: var(--primary); font-weight: 600; }
  .item-title { font-size: 0.92rem; font-weight: 500; line-height: 1.45; flex: 1; cursor: pointer; }
  .item-title:hover { color: var(--accent); }
  .item-actions { display: flex; gap: 0.4rem; }
  .item-actions .btn { flex: 1; justify-content: center; padding: 0.5rem 0.6rem; font-size: 0.82rem; }

  .btn {
    display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.9rem;
    border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500;
    text-decoration: none; color: #fff; transition: all 0.2s;
  }
  .btn-watch { background: var(--primary); }
  .btn-watch:hover { background: var(--primary-hover); }
  .btn-dl { background: var(--success); }
  .btn-dl:hover { background: #059669; }
  .btn-pdf { background: var(--pdf); }
  .btn-pdf:hover { background: var(--pdf-hover); }

  .empty { text-align: center; padding: 2.5rem; color: var(--text-muted); }
  .empty span { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }
  footer { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 1rem; }

  #viewer {
    position: fixed; inset: 0; z-index: 1000;
    background: #000;
    display: none; flex-direction: column;
  }
  #viewer.open { display: flex; }

  .viewer-toolbar {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    padding: 0.6rem 0.9rem;
    background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(15,23,42,0.92));
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .viewer-toolbar .title {
    flex: 1; min-width: 120px;
    font-size: 0.9rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #fff;
  }
  .viewer-toolbar .btn-group { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .vbtn {
    width: 40px; height: 40px; border: none; border-radius: 10px;
    background: rgba(255,255,255,0.1); color: #fff; font-size: 1.05rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 0.15s;
  }
  .vbtn:hover { background: rgba(255,255,255,0.2); }
  .vbtn:active { transform: scale(0.95); }
  .vbtn.primary { background: var(--primary); }
  .vbtn.primary:hover { background: var(--primary-hover); }
  .vbtn.success { background: var(--success); }
  .vbtn.danger { background: #ef4444; }
  .zoom-label {
    min-width: 52px; text-align: center; font-size: 0.8rem; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .viewer-stage {
    flex: 1; position: relative; overflow: hidden;
    background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
  }

  .viewer-content {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    transform-origin: center center;
    transition: transform 0.2s ease;
  }
  .viewer-content iframe {
    width: 100%; height: 100%; border: none;
    background: #111;
  }

  .viewer-content.rotated-90 {
    width: 100vh; height: 100vw;
  }
  .viewer-content.rotated-180 {}
  .viewer-content.rotated-270 {
    width: 100vh; height: 100vw;
  }

  .viewer-hint {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: #ccc; font-size: 0.78rem;
    padding: 0.4rem 0.9rem; border-radius: 20px; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
  .viewer-hint.show { opacity: 1; }

  @media (max-width: 600px) {
    .viewer-toolbar .title { font-size: 0.8rem; }
    .vbtn { width: 36px; height: 36px; font-size: 0.95rem; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div>أكاديمية البرمجة</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="ابحث في الفيديوهات والملفات..." oninput="filterItems()">
    </div>
    <div class="stats">
      <div class="stat-badge"><strong>353</strong> فيديو</div>
      <div class="stat-badge"><strong>174</strong> ملف PDF</div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="panel" id="contentPanel">
      <div class="panel-header">
        <span id="subjIcon" style="font-size:1.4rem">💻</span>
        <h2 id="subjTitle">اختر مادة من القائمة</h2>
        <div class="meta" id="subjMeta"></div>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="videos" onclick="switchTab('videos')">🎬 الفيديوهات</button>
        <button class="tab-btn" data-tab="pdfs" onclick="switchTab('pdfs')">📄 ملفات PDF</button>
      </div>
      <div id="itemsGrid" class="items-grid"></div>
    </div>
  </main>
</div>

<footer>جميع الملفات من جوجل درايف فقط • مشاهدة داخل الموقع • تحميل مباشر</footer>

<div id="viewer">
  <div class="viewer-toolbar">
    <button class="vbtn danger" onclick="closeViewer()" title="إغلاق">✕</button>
    <div class="title" id="viewerTitle">العرض</div>
    <div class="btn-group">
      <button class="vbtn" onclick="zoomOut()" title="تصغير">➖</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="vbtn" onclick="zoomIn()" title="تكبير">➕</button>
      <button class="vbtn" onclick="zoomReset()" title="الحجم الأصلي">⟲</button>
      <button class="vbtn" onclick="rotateScreen()" title="تدوير الشاشة">🔄</button>
      <button class="vbtn" onclick="toggleFullscreen()" title="ملء الشاشة">⛶</button>
      <button id="viewerDl" class="vbtn success" title="تحميل" type="button">⬇️</button>
    </div>
  </div>
  <div class="viewer-stage" id="viewerStage">
    <div class="viewer-content" id="viewerContent">
      <iframe id="viewerFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="viewer-hint" id="viewerHint">استخدم الأزرار للتكبير والتدوير</div>
  </div>
</div>

let currentSem = null, currentSubj = null, currentTab = "videos";
let zoomLevel = 1, rotation = 0;

function getDlUrl(id) {
  return "https://drive.google.com/uc?export=download&id=" + id + "&confirm=t";
}
function getViewUrl(id) {
  return "https://drive.google.com/file/d/" + id + "/view";
}
function doDownload(id, title) {
  var url = getDlUrl(id);
  var a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ try { a.remove(); } catch(e){} }, 150);
}
function getPreviewUrl(id) { return "https://drive.google.com/file/d/" + id + "/preview"; }

function buildSidebar() {
  const side = document.getElementById("sidebar");
  side.innerHTML = "";
  ["sem1","sem2","tests"].forEach(semId => {
    if (!DATA[semId]) return;
    const sem = DATA[semId];
    const group = document.createElement("div");
    group.className = "sem-group";
    group.innerHTML = `<div class="sem-title">${sem.icon} ${sem.title}</div>`;
    Object.keys(sem.subjects).forEach(subjKey => {
      const subj = sem.subjects[subjKey];
      const btn = document.createElement("button");
      btn.className = "subj-btn";
      btn.dataset.sem = semId; btn.dataset.subj = subjKey;
      const v = subj.videos.length, p = subj.pdfs.length;
      btn.innerHTML = `<span>${subj.icon}</span><span>${subj.title}</span>
        <span class="counts">${v?`<span class="badge-v">${v}</span>`:''}${p?`<span class="badge-p">${p}</span>`:''}</span>`;
      btn.onclick = () => selectSubject(semId, subjKey);
      group.appendChild(btn);
    });
    side.appendChild(group);
  });
}

function selectSubject(semId, subjKey) {
  currentSem = semId; currentSubj = subjKey; currentTab = "videos";
  document.getElementById("searchInput").value = "";
  document.querySelectorAll(".subj-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.sem === semId && b.dataset.subj === subjKey);
  });
  document.querySelectorAll(".tab-btn").forEach(t => t.classList.toggle("active", t.dataset.tab === "videos"));
  renderContent();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  renderContent();
}

function renderContent(filter) {
  filter = (filter || "").toLowerCase();
  const grid = document.getElementById("itemsGrid");
  grid.innerHTML = "";
  if (!currentSem || !currentSubj) {
    grid.innerHTML = '<div class="empty"><span>📚</span>اختر مادة من القائمة الجانبية</div>';
    return;
  }
  const subj = DATA[currentSem].subjects[currentSubj];
  document.getElementById("subjIcon").textContent = subj.icon;
  document.getElementById("subjTitle").textContent = subj.title;
  document.getElementById("subjMeta").textContent = subj.videos.length + " فيديو  •  " + subj.pdfs.length + " PDF";

  const items = currentTab === "videos" ? subj.videos : subj.pdfs;
  const filtered = items.filter(v => v.title.toLowerCase().includes(filter));
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty"><span>🔍</span>لا توجد نتائج مطابقة</div>';
    return;
  }
  filtered.forEach((item, idx) => {
    const card = document.createElement("div");
    card.className = "item-card";
    const isVideo = currentTab === "videos";
    card.innerHTML = `
      <div class="item-num">${isVideo ? "فيديو" : "ملف"} ${idx+1}</div>
      <div class="item-title">${item.title}</div>
      <div class="item-actions">
        <button class="btn ${isVideo ? "btn-watch" : "btn-pdf"}" onclick="openViewer('${item.id}', '${esc(item.title)}', ${isVideo})">
          ${isVideo ? "▶️ مشاهدة" : "📄 عرض"}
        </button>
        <button class="btn btn-dl" onclick="doDownload('${item.id}')">⬇️ تحميل</button>
      </div>`;
    card.querySelector(".item-title").onclick = () => openViewer(item.id, item.title, isVideo);
    grid.appendChild(card);
  });
}

function esc(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

function filterItems() { renderContent(document.getElementById("searchInput").value); }

function openViewer(id, title, isVideo) {
  zoomLevel = 1;
  rotation = 0;
  applyTransform();
  document.getElementById("viewerTitle").textContent = title;
  document.getElementById("viewerFrame").src = getPreviewUrl(id);
  document.getElementById("viewerDl").onclick = function(e){ e.preventDefault(); doDownload(id); };
  document.getElementById("viewer").classList.add("open");
  document.body.classList.add("viewer-open");
  showHint();
}

function closeViewer() {
  document.getElementById("viewer").classList.remove("open");
  document.body.classList.remove("viewer-open");
  document.getElementById("viewerFrame").src = "";
  zoomLevel = 1; rotation = 0;
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

function applyTransform() {
  const el = document.getElementById("viewerContent");
  el.style.transform = `scale(${zoomLevel}) rotate(${rotation}deg)`;
  document.getElementById("zoomLabel").textContent = Math.round(zoomLevel * 100) + "%";
  el.classList.remove("rotated-90","rotated-180","rotated-270");
  const r = ((rotation % 360) + 360) % 360;
  if (r === 90) el.classList.add("rotated-90");
  else if (r === 180) el.classList.add("rotated-180");
  else if (r === 270) el.classList.add("rotated-270");
}

function zoomIn() {
  zoomLevel = Math.min(zoomLevel + 0.25, 4);
  applyTransform();
}
function zoomOut() {
  zoomLevel = Math.max(zoomLevel - 0.25, 0.5);
  applyTransform();
}
function zoomReset() {
  zoomLevel = 1;
  applyTransform();
}

function rotateScreen() {
  rotation = (rotation + 90) % 360;
  applyTransform();
}

function toggleFullscreen() {
  const stage = document.getElementById("viewer");
  if (!document.fullscreenElement) {
    stage.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
}

function showHint() {
  const h = document.getElementById("viewerHint");
  h.classList.add("show");
  setTimeout(() => h.classList.remove("show"), 3000);
}
