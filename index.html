<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <title>EduSpace — Learning Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght+@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 11.2 12 6l9 5.2-9 5.2L3 11.2Z"/><path d="M6.5 13v4.2c2.8 2.2 8.2 2.2 11 0V13"/></svg>
        </div>
        <span>EduSpace</span>
      </div>

      <button class="sidebar-collapse" id="sidebarCollapse" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></svg>
      </button>

      <nav class="course-nav" aria-label="Course lessons">
        <div class="course-heading">
          <span>Course content</span>
          <span class="lesson-count" id="lessonCount">0</span>
        </div>
        <label class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
          <input id="lessonSearch" type="search" placeholder="Search lessons" autocomplete="off" />
        </label>
        <div class="module-list" id="moduleList"></div>
      </nav>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Open course navigation">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="progress-wrap">
          <div class="progress-meta"><span>Course progress</span><strong id="progressText">0%</strong></div>
          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="languageButton" aria-label="Switch language direction" title="Switch Arabic/English layout">ع</button>
          <button class="icon-button" id="themeButton" aria-label="Toggle dark mode">
            <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
          </button>
          <div class="avatar" aria-label="Student profile">ST</div>
        </div>
      </header>

      <section class="lesson-header">
        <div>
          <div class="breadcrumb" id="breadcrumb">Course</div>
          <h1 id="lessonTitle">Loading course</h1>
        </div>
        <label class="complete-control">
          <input type="checkbox" id="completeLesson" />
          <span class="checkmark"><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></svg></span>
          <span>Mark complete</span>
        </label>
      </section>

      <section class="viewer-section">
        <div class="viewer-toolbar">
          <div class="layout-switcher" aria-label="Viewer layout">
            <button class="layout-button active" data-layout="split" title="Split view" aria-label="Split view">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
            </button>
            <button class="layout-button" data-layout="stacked" title="Stacked view" aria-label="Stacked view">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></svg>
            </button>
          </div>
          <div class="panel-controls">
            <button class="text-button" data-expand="video">Expand video</button>
            <button class="text-button" data-expand="pdf">Expand PDF</button>
          </div>
        </div>

        <div class="split-view" id="splitView">
          <article class="media-panel" id="videoPanel">
            <header class="panel-header">
              <div class="panel-title">
                <span class="panel-icon video-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3Z"/></svg></span>
                <div><span class="eyebrow">Lesson video</span><strong id="videoName">Video</strong></div>
              </div>
              <a class="icon-button small" id="videoDriveButton" title="Open in Google Drive" aria-label="Open video in Google Drive" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
              </a>
            </header>
            <div class="frame-wrap" id="videoFrameWrap"><div class="empty-frame">Select or add a lesson to begin</div></div>
          </article>

          <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panels"></div>

          <article class="media-panel" id="pdfPanel">
            <header class="panel-header">
              <div class="panel-title">
                <span class="panel-icon pdf-icon"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v5h4M9 13h6M9 17h6"/></svg></span>
                <div><span class="eyebrow">Study material</span><strong id="pdfName">PDF notes</strong></div>
              </div>
              <a class="icon-button small" id="pdfDownloadButton" title="Download PDF" aria-label="Download PDF" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
              </a>
            </header>
            <div class="frame-wrap" id="pdfFrameWrap"><div class="empty-frame">No PDF available</div></div>
          </article>
        </div>
      </section>

      <footer class="lesson-footer">
        <button class="nav-button" id="previousLesson">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          <div><span>Previous lesson</span><strong id="previousTitle">—</strong></div>
        </button>
        <button class="nav-button next" id="nextLesson">
          <div><span>Next lesson</span><strong id="nextTitle">—</strong></div>
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </footer>
    </main>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
